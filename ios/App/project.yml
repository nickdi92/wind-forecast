# Source of truth for App.xcodeproj: regenerate with `npm run ios:project` (XcodeGen) after editing.
# Capacitor only rewrites CapApp-SPM/Package.swift and copies the web build into App/public.
name: App
options:
  bundleIdPrefix: io.github.nickdi92
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: it
configFiles:
  Debug: ../debug.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
packages:
  CapApp-SPM:
    path: CapApp-SPM
  WindCore:
    path: ../WindCore
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - public
          - capacitor.config.json
          - config.xml
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
      - path: App/config.xml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.vento
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CapApp-SPM
        product: CapApp-SPM
      - package: WindCore
      - target: VentoWidget
    scheme:
      testTargets:
        - AppUITests
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.vento.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: App
  VentoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VentoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nickdi92.vento.widget
        INFOPLIST_FILE: VentoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VentoWidget/VentoWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - package: WindCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
